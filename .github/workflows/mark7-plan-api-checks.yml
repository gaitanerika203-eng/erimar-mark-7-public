name: MARK7 isolated API checks
on:
  pull_request:
    paths:
      - 'server/mark7-plan-api/**'
      - '.github/workflows/mark7-plan-api-checks.yml'
  push:
    paths:
      - 'server/mark7-plan-api/**'
      - '.github/workflows/mark7-plan-api-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: server/mark7-plan-api
